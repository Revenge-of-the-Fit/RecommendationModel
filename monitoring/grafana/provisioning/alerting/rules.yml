apiVersion: 1
groups:
  - orgId: 1
    name: required
    folder: M3 Production
    interval: 30s
    rules:
      - uid: gateway-unreachable
        title: Gateway unreachable
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
        annotations:
          trigger: "Blackbox probe of http://gateway:8082/health/ready has failed (probe_success < 1) for 2 minutes, or no probe data is arriving."
          summary: "The public recommendation endpoint is down or not ready. Follow the runbook: check `docker compose ps`, restart the gateway, roll back the model if needed."
          runbook_url: "https://github.com/Revenge-of-the-Fit/RecommendationModel/blob/main/INCIDENT_RESPONSE.md"
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'probe_success{job="gateway-ready"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
