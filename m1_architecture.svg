<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation service architecture</title>
  <desc id="desc">The university VM contains Docker containers for the Kafka consumer and API, and a persistent SQLite database. The API contains request handling, the EASE model, and a background profile worker. Separate external systems are course requests, Kafka, the metadata API, and OpenAI. Black arrows show their interactions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#000000"/></marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #000000; text-anchor: middle; font-size: 14px; }
    .title { font-weight: 700; }
    .label { font-size: 12px; }
    .edge { fill: none; stroke: #000000; stroke-width: 1.8; marker-end: url(#arrow); }
    .both { marker-start: url(#arrow); }
    .external { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; }
    .logic { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.2; }
  </style>
  <rect width="780" height="360" fill="#ffffff"/>
  <rect x="180" y="15" width="445" height="335" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>
  <text x="402.5" y="31" class="title">University VM</text>
  <rect x="195" y="40" width="265" height="295" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="327.5" y="56" class="title">Docker containers</text>
  <rect x="205" y="110" width="240" height="215" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="325" y="127" class="title">API container :8082</text>
  <path class="edge both" d="M 145 167.5 L 215 167.5"/>
  <text x="180" y="157" class="label">HTTP :8082</text>
  <path class="edge" d="M 145 82.5 L 215 82.5"/>
  <text x="180" y="75" class="label">SSH tunnel</text>
  <path class="edge" d="M 435 82.5 L 548 82.5 L 548 133"/>
  <text x="500" y="74" class="label">Activity events</text>
  <path class="edge both" d="M 435 167.5 L 485 174"/>
  <text x="460" y="157" class="label">History</text>
  <path class="edge" d="M 325 190 L 325 208"/>
  <text x="367" y="204" class="label">Score</text>
  <path class="edge both" d="M 400 260 L 400 250 L 520 250 L 520 222"/>
  <text x="463" y="241" class="label">Jobs / profiles</text>
  <path class="edge both" d="M 435 275 L 640 265.5"/>
  <text x="555" y="258" class="label">Descriptions</text>
  <path class="edge both" d="M 435 290 L 535 290 L 535 317.5 L 640 317.5"/>
  <text x="587" y="307" class="label">Preferences</text>
  <rect x="5" y="145" width="140" height="45" class="external"/>
  <text x="75" y="172">Course requests</text>
  <rect x="5" y="65" width="140" height="35" class="external"/>
  <text x="75" y="87">Kafka: movielog2</text>
  <rect x="640" y="248" width="135" height="35" class="external"/>
  <text x="707.5" y="270">Metadata API</text>
  <rect x="640" y="300" width="135" height="35" class="external"/>
  <text x="707.5" y="322">OpenAI</text>
  <rect x="215" y="65" width="220" height="35" class="logic"/>
  <text x="325" y="87">Kafka consumer</text>
  <rect x="215" y="145" width="220" height="45" class="logic"/>
  <text x="325" y="162">Request handling</text>
  <text x="325" y="180">+ cold-start ranking</text>
  <rect x="260" y="208" width="135" height="32" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="327.5" y="229">EASE model</text>
  <rect x="215" y="260" width="220" height="40" class="logic"/>
  <text x="325" y="285">Background profile worker</text>
  <path d="M 485 143 L 485 213 A 62.5 10 0 0 0 610 213 L 610 143" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <ellipse cx="547.5" cy="143" rx="62.5" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="547.5" y="169" class="title">SQLite database</text>
  <text x="547.5" y="188" class="label">History / profiles</text>
  <text x="547.5" y="206" class="label">Persistent volume</text>
</svg>

